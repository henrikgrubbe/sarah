<div
  id="background"
  class="flex h-screen flex-col items-center justify-center gap-8 bg-cover lg:gap-16"
>
  <h1
    class="font-heading text-center text-8xl font-bold text-white select-none text-shadow-lg"
  >
    Hvornår kommer Sarah?
  </h1>

  <div class="flex flex-wrap justify-center gap-4 lg:gap-8">
    @let _timeLeft = timeLeft();

    @if (_timeLeft === undefined) {
      <h2>Der er desværre ingen aftaler for hvornår Sarah kommer</h2>
    } @else {
      @if (_timeLeft.months; as value) {
        <app-countdown-unit
          [value]="value"
          [unit]="{ singular: 'måned', plural: 'måneder' }"
        />
      }

      @if (_timeLeft.weeks; as value) {
        <app-countdown-unit
          [value]="value"
          [unit]="{ singular: 'uge', plural: 'uger' }"
        />
      }

      @if (_timeLeft.days; as value) {
        <app-countdown-unit
          [value]="value"
          [unit]="{ singular: 'dag', plural: 'dage' }"
        />
      }

      <app-countdown-unit
        [value]="_timeLeft.hours"
        [unit]="{ singular: 'time', plural: 'timer' }"
      />

      <app-countdown-unit
        [value]="_timeLeft.minutes"
        [unit]="{ singular: 'minut', plural: 'minutter' }"
        [leftPad]="true"
      />

      <app-countdown-unit
        [value]="_timeLeft.seconds"
        [unit]="{ singular: 'sekund', plural: 'sekunder' }"
        [leftPad]="true"
      />
    }
  </div>
</div>
